name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in scripts/*.sh skills/design-brain/scripts/*.sh; do bash -n "$f"; done
      - name: Versions in sync
        run: bash scripts/check-version-sync.sh
